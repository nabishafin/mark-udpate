# These zones are shared by nginx workers and protect the upstream Node/PHP
# application before per-process application limits are reached.
limit_req_zone $binary_remote_addr zone=mdrn_api:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=mdrn_per_ip:10m;

# Redirect all HTTP traffic to the canonical HTTPS root domain.
server {
    listen 80;
    listen [::]:80;

    server_name mdrnlifeddw.com www.mdrnlifeddw.com;
    return 301 https://mdrnlifeddw.com$request_uri;
}

# HTTPS app. The certificate must include BOTH mdrnlifeddw.com and
# www.mdrnlifeddw.com:
# sudo certbot --nginx -d mdrnlifeddw.com -d www.mdrnlifeddw.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mdrnlifeddw.com www.mdrnlifeddw.com;

    ssl_certificate /etc/letsencrypt/live/mdrnlifeddw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdrnlifeddw.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve immutable release artifacts from /var/www. nginx workers commonly
    # cannot traverse /root, which can otherwise turn valid files into 403s.
    # The deployment procedure atomically updates the "current" symlink.
    root /var/www/mdrnlifeddw.com/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;
    client_max_body_size 64k;
    limit_conn mdrn_per_ip 30;

    # Canonicalize www after TLS succeeds. This requires the certificate above
    # to include www, otherwise Safari/mobile clients fail before redirecting.
    if ($host = www.mdrnlifeddw.com) {
        return 301 https://mdrnlifeddw.com$request_uri;
    }

    # Consolidate legacy Shopify URLs that remain in search results.
    location ~ ^/pages/(q-a-how-to-deplete-deuterium-from-water|deuterium|faq|sca-affiliate-empty-page)/?$ {
        return 301 https://mdrnlifeddw.com/science;
    }
    location = /pages/about-us { return 301 https://mdrnlifeddw.com/founder; }
    location = /pages/scientific-studies { return 301 https://mdrnlifeddw.com/research; }
    location = /pages/subscription-policy { return 301 https://mdrnlifeddw.com/policies/subscription-policy; }
    location = /pages/ccpa-opt-out { return 301 https://mdrnlifeddw.com/policies/privacy-policy; }
    location = /pages/collab { return 301 https://mdrnlifeddw.com/contact; }
    location = /collections/all { return 301 https://mdrnlifeddw.com/products; }
    location ~ ^/products/(mdrn-life-ddw|mdrn-life-ddw-pet-plastic)/?$ {
        return 301 https://mdrnlifeddw.com/products;
    }

    # API requests must reach Node. Without this, nginx/static hosting returns
    # 405 for POST /api/email-support.
    location ^~ /api/ {
        limit_req zone=mdrn_api burst=8 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Shopify checkout/order continuations must leave the static SPA before
    # nginx can serve index.html for them.
    location = /a/checkout {
        return 302 https://orise-6796.myshopify.com$request_uri;
    }

    location ~ ^/(cart/c|cart/[0-9].*|checkouts|wallets/checkouts|orders)(/.*)?$ {
        return 302 https://orise-6796.myshopify.com$request_uri;
    }

    location ~ ^/checkout/.+$ {
        return 302 https://orise-6796.myshopify.com$request_uri;
    }

    location ~ ^/[0-9]+/orders(/.*)?$ {
        return 302 https://orise-6796.myshopify.com$request_uri;
    }

    # Shopify app-proxy routes (including Appstle's customer subscription
    # portal) must reach Shopify's storefront edge. The public domain points
    # at this headless VPS, so without this bridge /apps/subscriptions is
    # mistaken for an unknown static path and returns 404. Keep the original
    # Host header so Shopify resolves the correct store without redirecting
    # back to this server in a loop.
    location ~ ^/(?:apps(?:/|$)|\.well-known/shopify(?:/|$)|sf_private_access_tokens$) {
        proxy_pass https://orise-6796.myshopify.com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name orise-6796.myshopify.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 8s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_redirect https://orise-6796.myshopify.com/ https://mdrnlifeddw.com/;
        proxy_cookie_domain orise-6796.myshopify.com mdrnlifeddw.com;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Shopify renders its app-proxy portal with storefront assets under this
    # same-domain path. Proxying it keeps those scripts, styles, and images
    # functional while retaining Shopify's own immutable cache headers.
    location ^~ /cdn/ {
        proxy_pass https://orise-6796.myshopify.com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name orise-6796.myshopify.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Shopify theme helpers invoked by the proxied portal.
    location = /cart/update.js {
        proxy_pass https://orise-6796.myshopify.com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name orise-6796.myshopify.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Machine-readable SEO files.
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    # Some clients still request the historical .ico URL even though the site
    # declares an SVG favicon. Redirect it to the real icon instead of serving
    # an HTML error document as an image request.
    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    # Generated dynamic content routes need Node to distinguish valid slugs
    # from fake URLs and return the correct HTTP status.
    location ~ ^/(blogs/news/.+|learn/.+)/?$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Known React/Vite SPA routes. These exact/regex rules prevent asset
    # directories such as /products from causing nginx directory redirects.
    location = / {
        expires -1;
        try_files /index.html =500;
    }

    # /products is also a real asset directory. Exact route rules MUST come
    # before the generic location so nginx never performs a directory redirect
    # and never tries to list the directory (which produces the live 403).
    location = /products {
        expires -1;
        try_files /products/index.html /index.html =500;
    }

    location = /products/ {
        expires -1;
        try_files /products/index.html /index.html =500;
    }

    location ~ ^/(science|science/lab-testing|benefits|athletes-recovery|healthy-aging|shop|products|cart|products/cart|checkout|login|register|forgot-password|reset-password|account|account/activate|account/orders|research|blogs|blogs/news|contact|learn|founder|pages/refund)/?$ {
        expires -1;
        try_files $uri/index.html /index.html =500;
    }

    location ~ ^/(account/orders/.+|account/reset/.+|account/activate/.+|policies/.+)/?$ {
        expires -1;
        try_files $uri/index.html /index.html =500;
    }

    location ~* \.html$ {
        expires -1;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://cdn.shopify.com; connect-src 'self' https://orise-6796.myshopify.com https://mdrnlifeddw.com; frame-src 'self'; form-action 'self' https://orise-6796.myshopify.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    # Static assets.
    location ~* \.(?:css|js|mjs|json|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        # nginx does not inherit server-level add_header directives when a
        # location defines its own add_header. Repeat the security headers so
        # both real assets and asset-shaped 404 responses stay protected.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://cdn.shopify.com; connect-src 'self' https://orise-6796.myshopify.com https://mdrnlifeddw.com; frame-src 'self'; form-action 'self' https://orise-6796.myshopify.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|webm|mp4|ogg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://cdn.shopify.com; connect-src 'self' https://orise-6796.myshopify.com https://mdrnlifeddw.com; frame-src 'self'; form-action 'self' https://orise-6796.myshopify.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    # Static files that did not match a known SPA route. Directories and unknown
    # paths return 404 instead of leaking a 403 or fake SPA success.
    location / {
        if (-d $request_filename) {
            return 404;
        }
        try_files $uri =404;
    }

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://cdn.shopify.com; connect-src 'self' https://orise-6796.myshopify.com https://mdrnlifeddw.com; frame-src 'self'; form-action 'self' https://orise-6796.myshopify.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
}
