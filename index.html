    <style id="boot-critical">
      html {
        background: #050608;
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #050608;
        color: #e7ecf3;
      }

      #root {
        min-height: 100vh;
      }

      [data-prerendered='true'] {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 42%, rgba(63, 184, 255, 0.12), transparent 34%),
          #050608;
        color: #e7ecf3;
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .prerender-loader {
        display: none;
      }

      html.js [data-prerendered='true'] {
        display: grid;
        place-items: center;
      }

      html.js .prerender-content {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      html.js .prerender-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .prerender-loader__mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(120, 209, 255, 0.24);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 18px 60px rgba(22, 151, 225, 0.14);
      }

      .prerender-loader__mark img {
        display: block;
        width: 42px;
        height: auto;
      }

      .prerender-loader__line {
        width: 72px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .prerender-loader__line::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #3fb8ff;
        box-shadow: 0 0 16px rgba(63, 184, 255, 0.72);
        content: "";
        animation: mdrn-boot 900ms ease-in-out infinite alternate;
      }

      @keyframes mdrn-boot {
        from { transform: translateX(0); opacity: 0.55; }
        to { transform: translateX(138%); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .prerender-loader__line::after {
          animation: none;
          transform: translateX(70%);
        }
      }
    </style>
    <noscript>

        html.js [data-prerendered='true'] {

          width: auto !important;
          height: auto !important;

          padding: 15vh 24px 48px !important;
          margin: 0 auto !important;
          overflow: visible !important;
          clip: auto !important;
          white-space: normal !important;
          border: 0 !important;
          text-align: center;
        }

        html.js .prerender-content a {
          color: #78d1ff;
        }
      </style>
